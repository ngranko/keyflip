name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

# Two pushes in quick succession must not race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/test.yml

  version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      changed: ${{ steps.semver.outputs.changed }}
      is_tagged: ${{ steps.resolve.outputs.is_tagged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate semantic version
        id: semver
        uses: PaulHatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false
          search_commit_body: false
          user_format_type: "csv"
          enable_prerelease_mode: true
          debug: false
          bump_each_commit_patch_pattern: ""

      - name: Reuse a release tag on this commit
        id: resolve
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          TAG: ${{ steps.semver.outputs.version_tag }}
        run: |
          set -euo pipefail
          existing=$(git tag --points-at HEAD --list 'v*' --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')
          if [ -n "$existing" ]; then
            TAG="$existing"
            VERSION="${existing#v}"
            echo 'is_tagged=true' >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Report
        env:
          TAG: ${{ steps.semver.outputs.version_tag }}
          PREVIOUS: ${{ steps.semver.outputs.previous_version }}
          BUMP: ${{ steps.semver.outputs.version_type }}
        run: echo "::notice::Next release is $TAG ($BUMP bump from $PREVIOUS)"

  release:
    name: Build and release
    needs: [version, validate]
    # A failed upload may have left the tag behind; reruns must finish publishing it.
    if: needs.version.outputs.changed == 'true' || needs.version.outputs.is_tagged == 'true'
    permissions:
      contents: write
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: make test

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::error::SIGNING_CERTIFICATE_P12 is not set. See docs/signing.md."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          p12="$RUNNER_TEMP/signing.p12"

          echo "$CERTIFICATE_P12" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          # No flags: never auto-lock, so a slow build cannot lose the key mid-job.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without a partition list codesign blocks on a GUI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          # codesign only searches keychains that are on the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$p12"

      - name: Build app bundle
        run: make app

      - name: Verify public app architectures
        run: bash Tools/release/verify-support.sh .build/Keyflip.app/Contents/MacOS/Keyflip .build/Keyflip.app/Contents/Info.plist

      - name: Stamp version into the bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          plist=.build/Keyflip.app/Contents/Info.plist
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$plist"
          plutil -replace CFBundleVersion -string "$BUILD" "$plist"
          # Editing Info.plist invalidates the signature `make app` applied.
          make sign

      - name: Zip app bundle
        id: package
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          zip="Keyflip-${TAG}.zip"
          # ditto, not zip: it keeps the bundle's symlinks and metadata intact.
          ditto -c -k --sequesterRsrc --keepParent .build/Keyflip.app "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Tag the commit
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
          else
            git tag -a "$TAG" -m "Release $VERSION"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          cat > install-note.md <<'NOTE'
          Keyflip is signed with a self-signed certificate and is not notarized,
          so macOS blocks it on first launch. Move `Keyflip.app` to
          `/Applications` first, then either:

          - open it, dismiss the warning, and click **Open Anyway** in **System
            Settings → Privacy & Security**; or
          - run `xattr -dr com.apple.quarantine /Applications/Keyflip.app`.
          NOTE
          # --generate-notes appends GitHub's own changelog under the note above.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            exit 0
          fi
          gh release create "$TAG" "$ZIP" \
            --title "Keyflip $VERSION" \
            --notes-file install-note.md \
            --generate-notes \
            --verify-tag

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12"
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
